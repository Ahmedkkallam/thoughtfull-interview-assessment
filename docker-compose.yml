services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thoughtfull
      POSTGRES_PASSWORD: thoughtfull
      POSTGRES_DB: thoughtfull
    ports:
      - "54320:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thoughtfull -d thoughtfull"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: create the tables, then add the demo accounts (safe to repeat).
  migrate:
    build: .
    command: sh -c "npm run db:migrate -w apps/api && npm run seed -w apps/api"
    environment: &app-env
      DATABASE_URL: postgres://thoughtfull:thoughtfull@db:5432/thoughtfull
      SEED_PASSWORD: ${SEED_PASSWORD:-demo-password-123}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: npm run start -w apps/api
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: npm run worker -w apps/api
    restart: unless-stopped
    environment:
      <<: *app-env
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Local mail catcher: reminder emails land here (web UI on http://localhost:8025), never on the internet.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build: .
    command: npm run dev -w apps/web -- --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

  # Throwaway database for tests: data lives in memory and vanishes on down.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thoughtfull
      POSTGRES_PASSWORD: thoughtfull
      POSTGRES_DB: thoughtfull_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thoughtfull -d thoughtfull_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
